<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五年級資優鑑定推理練習</title>
<style>
  :root { --ink:#263247; --muted:#64748b; --paper:#fffdf8; --line:#e5e7eb; --accent:#4f7cac; --accent2:#f2c879; --good:#19734a; --bad:#b42318; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif; background:#f3f6fb; color:var(--ink); line-height:1.65; }
  header { padding:32px 18px 26px; background:linear-gradient(135deg,#e7f2ff,#fff1d9); text-align:center; }
  header .emoji { font-size:2.4rem; }
  h1 { margin:8px 0; font-size:clamp(1.55rem,4vw,2.25rem); }
  header p { margin:6px auto; max-width:680px; color:#475569; }
  main { max-width:850px; margin:22px auto 56px; padding:0 14px; }
  .notice,.score-card,.question { background:white; border:1px solid var(--line); border-radius:18px; padding:18px; margin-bottom:16px; box-shadow:0 4px 16px #2030500a; }
  .notice { border-left:5px solid var(--accent2); }
  .section-title { margin:26px 4px 12px; font-size:1.2rem; }
  .q-head { display:flex; gap:10px; align-items:flex-start; }
  .num { flex:0 0 34px; height:34px; border-radius:11px; background:#e8f1fb; display:grid; place-items:center; font-weight:800; color:#315c85; }
  .q-title { margin:2px 0 14px; font-weight:700; }
  .options { display:grid; gap:9px; }
  .option { display:flex; align-items:flex-start; gap:10px; border:1px solid #d9e1ea; border-radius:12px; padding:10px 12px; cursor:pointer; transition:.15s; }
  .option:hover { background:#f7faff; border-color:#8fb1d4; }
  .option input { margin-top:5px; accent-color:var(--accent); }
  .option:has(input:checked) { background:#edf5ff; border-color:var(--accent); }
  .feedback { display:none; margin-top:13px; padding:12px 13px; border-radius:12px; background:#f3f7fb; font-size:.96rem; }
  .feedback.show { display:block; }
  .feedback.correct { border-left:4px solid var(--good); }
  .feedback.incorrect { border-left:4px solid var(--bad); }
  .actions { display:flex; flex-wrap:wrap; gap:10px; margin:20px 0; }
  button { border:0; border-radius:12px; padding:12px 17px; font:inherit; font-weight:700; cursor:pointer; }
  .primary { background:#315f8d; color:white; }
  .secondary { background:white; color:var(--ink); border:1px solid #cbd5e1; }
  button:focus-visible, input:focus-visible { outline:3px solid #f2c879; outline-offset:3px; }
  .score-card { display:none; text-align:center; background:#fff; }
  .score-card.show { display:block; }
  .score { font-size:2.2rem; font-weight:850; color:#315f8d; }
  .small { color:var(--muted); font-size:.9rem; }
  footer { text-align:center; color:var(--muted); font-size:.85rem; padding:0 16px 30px; }
  @media (min-width:640px) { .question { padding:22px; } .options { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<header>
  <div class="emoji" aria-hidden="true">🕵️‍♀️ 🧠 ✨</div>
  <h1>五年級資優鑑定推理練習</h1>
  <p>觀察規律、數量推理、語文理解、邏輯思考</p>
  <p class="small">自編練習題｜共 12 題｜作答後可查看答案與解析</p>
</header>
<main>
  <div class="notice">
    <strong>📌 小提醒</strong><br>
    這是依一般智力測驗常見能力設計的自編練習，不是新北市官方考古題，也不能用來推估正式鑑定結果。請先自己思考，再按「批改答案」。
  </div>
  <div id="quiz"></div>
  <div class="actions">
    <button class="primary" id="gradeBtn">批改答案</button>
    <button class="secondary" id="resetBtn">重新作答</button>
  </div>
  <section class="score-card" id="scoreCard" aria-live="polite">
    <h2>🎉 練習結果</h2>
    <div class="score" id="scoreText">0 / 12</div>
    <p id="scoreMessage"></p>
    <p class="small">這是本份練習的答題結果，不代表智力或正式鑑定表現。</p>
  </section>
</main>
<footer>慢慢讀題、找出線索；答錯也能幫助我們學會新的思考方法！</footer>
<script>
const questions = [
 {section:"一、圖形與規律",q:"找出下一個圖形：○、△、△、○、△、△、○、？",opts:["○","△","□","◇"],ans:1,why:"每三個圖形為一組：○、△、△，所以接下來是 △。"},
 {section:"一、圖形與規律",q:"一個箭頭每次順時針旋轉 90°：↑、→、↓、？",opts:["↑","←","→","↓"],ans:1,why:"每次順時針旋轉 90°，向下之後會轉向左。"},
 {section:"一、圖形與規律",q:"找出下一個數字：1、4、9、16、25、？",opts:["30","35","36","49"],ans:2,why:"依序是 1²、2²、3²、4²、5²，下一個是 6²＝36。"},
 {section:"二、數量推理",q:"找規律：3、7、15、31、63、？",opts:["95","126","127","129"],ans:2,why:"每個數字乘以 2 再加 1：63 × 2 ＋ 1 ＝ 127。"},
 {section:"二、數量推理",q:"找規律：2、5、10、17、26、？",opts:["35","36","37","38"],ans:2,why:"相鄰數字的差依序是 3、5、7、9，下一個差是 11，所以 26 ＋ 11 ＝ 37。"},
 {section:"二、數量推理",q:"4 台機器 4 分鐘製作 4 個零件。假設每台機器速度相同，8 台機器 8 分鐘可製作幾個零件？",opts:["8 個","16 個","32 個","64 個"],ans:1,why:"4 台機器 4 分鐘做 4 個，表示每台機器 4 分鐘做 1 個。8 分鐘每台做 2 個，8 台共做 8 × 2 ＝ 16 個。正確答案是 B。"},
 {section:"三、語文推理",q:"醫生之於醫院，如同老師之於？",opts:["書店","學校","公園","市場"],ans:1,why:"醫生通常在醫院工作，老師通常在學校工作。"},
 {section:"三、語文推理",q:"以下哪一項最不同類？",opts:["蘋果","香蕉","紅蘿蔔","葡萄"],ans:2,why:"以常見的植物食用部位分類，紅蘿蔔是根，其餘三項通常歸類為水果。"},
 {section:"三、語文推理",q:"小安比小文早到，小文比小凱早到。誰最晚到？",opts:["小安","小文","小凱","無法判斷"],ans:2,why:"到達順序是小安、小文、小凱，因此小凱最晚到。"},
 {section:"四、邏輯推理",q:"所有的貓都是動物，有些動物會游泳。下列哪個結論一定正確？",opts:["所有的貓都會游泳","有些貓會游泳","所有的貓都是動物","沒有貓會游泳"],ans:2,why:"題目明確告訴我們所有貓都是動物，但沒有說哪些動物會游泳，因此只能確定 C。"},
 {section:"四、邏輯推理",q:"紅、藍、綠三個盒子各放一顆不同顏色的球，三顆球分別是紅、藍、綠色。紅盒不是紅球，藍盒不是藍球，綠盒放紅球。紅盒放什麼顏色的球？",opts:["紅球","藍球","綠球","無法判斷"],ans:1,why:"綠盒已放紅球。紅盒不能放紅球；若紅盒放綠球，藍盒只能放藍球，但藍盒不能放藍球。因此紅盒放藍球，藍盒放綠球。"},
 {section:"四、邏輯推理",q:"小明、小華、小美參加比賽。小明不是第一名，小華不是最後一名，小美比小明名次前面。誰可能是第一名？",opts:["只有小明","只有小華","只有小美","小華或小美"],ans:3,why:"小明不是第一名，小美又比小明前面，因此小美可能是第一名；小華也可能是第一名。題目條件不足以確定唯一排序。"}
];
const letters = ["A","B","C","D"];
const quiz = document.getElementById("quiz");
let lastSection = "";
questions.forEach((item,i) => {
  if(item.section !== lastSection) {
    const heading = document.createElement("h2");
    heading.className = "section-title";
    heading.textContent = item.section;
    quiz.appendChild(heading);
    lastSection = item.section;
  }
  const card = document.createElement("section");
  card.className = "question";
  card.id = `q${i}`;
  const head = document.createElement("div");
  head.className = "q-head";
  const num = document.createElement("div");
  num.className = "num";
  num.textContent = i+1;
  const title = document.createElement("div");
  title.className = "q-title";
  title.textContent = item.q;
  head.append(num,title);
  card.appendChild(head);
  const options = document.createElement("div");
  options.className = "options";
  item.opts.forEach((opt,j) => {
    const label = document.createElement("label");
    label.className = "option";
    const input = document.createElement("input");
    input.type = "radio";
    input.name = `q${i}`;
    input.value = j;
    const text = document.createElement("span");
    text.textContent = `${letters[j]}. ${opt}`;
    label.append(input,text);
    options.appendChild(label);
  });
  card.appendChild(options);
  const feedback = document.createElement("div");
  feedback.className = "feedback";
  feedback.id = `feedback${i}`;
  card.appendChild(feedback);
  quiz.appendChild(card);
});
document.getElementById("gradeBtn").addEventListener("click", () => {
  let score = 0, unanswered = 0;
  questions.forEach((item,i) => {
    const selected = document.querySelector(`input[name="q${i}"]:checked`);
    const fb = document.getElementById(`feedback${i}`);
    fb.className = "feedback show";
    if(!selected) {
      unanswered++;
      fb.classList.add("incorrect");
      fb.innerHTML = `<strong>尚未作答。</strong> 正確答案：${letters[item.ans]}. ${item.opts[item.ans]}<br>${item.why}`;
    } else if(Number(selected.value) === item.ans) {
      score++;
      fb.classList.add("correct");
      fb.innerHTML = `<strong>✓ 答對了！</strong><br>${item.why}`;
    } else {
      fb.classList.add("incorrect");
      fb.innerHTML = `<strong>再看看線索。</strong> 正確答案：${letters[item.ans]}. ${item.opts[item.ans]}<br>${item.why}`;
    }
  });
  const panel = document.getElementById("scoreCard");
  panel.classList.add("show");
  document.getElementById("scoreText").textContent = `${score} / ${questions.length}`;
  document.getElementById("scoreMessage").textContent = unanswered ? `還有 ${unanswered} 題沒有作答；已依目前答案計分。` : (score===12 ? "太棒了！每一題都答對了！" : score>=9 ? "表現不錯！可以再看看答錯題目的解析。" : "別著急，看看解析，找出每題的規律和線索，再試一次！");
  panel.scrollIntoView({behavior:"smooth",block:"center"});
});
document.getElementById("resetBtn").addEventListener("click", () => {
  document.querySelectorAll('input[type="radio"]').forEach(input => input.checked = false);
  document.querySelectorAll(".feedback").forEach(fb => { fb.className = "feedback"; fb.textContent = ""; });
  document.getElementById("scoreCard").classList.remove("show");
  window.scrollTo({top:0,behavior:"smooth"});
});
</script>
</body>
</html>
